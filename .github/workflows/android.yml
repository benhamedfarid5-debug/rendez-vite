name: Android (Play Store)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Construire le fichier .aab (non signé)
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon bundleRelease
      - name: Publier le fichier sur la branche android-build
        run: |
          mkdir -p /tmp/out && cp android/app/build/outputs/bundle/release/*.aab /tmp/out/rendez-vite-unsigned.aab
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan android-build && git rm -rf . -q
          cp /tmp/out/rendez-vite-unsigned.aab . && git add rendez-vite-unsigned.aab
          git commit -m "AAB ${GITHUB_SHA::7}" && git push -f origin android-build
